name = "viscosity_solns"
version = "0.3.0"
description = "Lean 4 formalization of viscosity-solution theory for second-order degenerate elliptic PDE"
keywords = ["math"]
defaultTargets = ["ViscositySolns", "ViscositySolnsComparator"]
preferReleaseBuild = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.1"

[[require]]
name = "AleksandrovDifferentiability"
git = "https://github.com/willmfeldman/aleksandrov-differentiability"
rev = "v0.3.0"

[[lean_lib]]
name = "ViscositySolns"

[[lean_lib]]
name = "ViscositySolnsComparator"
roots = ["ViscositySolns.Comparator"]
